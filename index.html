<title>BESTIA Z KOPERNIKA</title>
<style>
:root{color-scheme:dark;--bg:#101014;--cream:#eee7d9;--muted:#a5a0a0;--red:#c73a37}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100svh;overflow-x:hidden}
.page{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:clamp(18px,4vw,42px) 16px 20px;background:radial-gradient(ellipse at 50% 10%,#2c2020 0%,#171519 38%,#101014 75%)}
.top{width:min(100%,980px);display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand{font-weight:950;letter-spacing:.075em;font-size:clamp(19px,4vw,30px);line-height:1.05}
.brand span{display:block;color:var(--red);margin-top:5px}
.tag{font-size:clamp(15px,2.2vw,20px);font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:#e7d6d4;border:1px solid #77545a;padding:12px 16px;border-radius:99px;white-space:nowrap;text-shadow:0 0 14px #c73a3755}
.scene{position:relative;width:min(100%,980px);aspect-ratio:1.18/1;min-height:390px;max-height:72svh;border:1px solid #4b3d3d;border-radius:18px;overflow:hidden;background:#1b1719;box-shadow:0 28px 90px #0009}
.scene:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0b09092b 0%,transparent 30%,#0808091f 64%,#080809a8 100%),radial-gradient(ellipse at center,transparent 42%,#0505078a 100%)}
svg{display:block;width:100%;height:100%}
.actionbar{width:min(100%,980px);display:flex;justify-content:center;margin-top:16px}\n.action-button{appearance:none;border:0;border-radius:10px;padding:15px 24px;background:#c73a37;color:#fff4eb;font:900 15px/1 Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;cursor:pointer;box-shadow:0 7px 0 #772321,0 12px 26px #0005;transition:transform .12s,filter .12s}\n.action-button:hover{filter:brightness(1.12)}.action-button:active{transform:translateY(4px);box-shadow:0 3px 0 #772321,0 7px 16px #0005}.action-button:disabled{opacity:.65;cursor:wait}\n.actionbar{width:min(100%,980px);display:flex;justify-content:center;margin-top:16px}.action-button{border:0;border-radius:10px;padding:15px 24px;background:#c73a37;color:#fff4eb;font:900 15px/1 Inter,system-ui,sans-serif;letter-spacing:.08em;cursor:pointer;box-shadow:0 7px 0 #772321,0 12px 26px #0005}.action-button:disabled{opacity:.7;cursor:wait}\n.caption{width:min(100%,980px);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-top:17px}
.caption h1{font-size:clamp(18px,3vw,26px);letter-spacing:.02em;margin:0;font-weight:850}
.caption p{margin:7px 0 0;color:var(--muted);font-size:14px;line-height:1.55;max-width:540px}
.status{flex:none;border-left:2px solid var(--red);padding:3px 0 3px 12px;color:#d8b6b4;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.grain{position:absolute;inset:0;opacity:.13;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");mix-blend-mode:screen}
@media(max-width:560px){.page{padding:18px 12px 22px}.top{margin-bottom:14px}.tag{font-size:15px;padding:10px 13px;letter-spacing:.1em}.scene{aspect-ratio:.73/1;min-height:0;max-height:none}.caption{flex-direction:column;gap:12px}.status{margin-top:1px}.caption p{font-size:13px}}
@media(min-width:561px) and (max-height:650px){.scene{min-height:300px;max-height:62svh}}

/* Cinematic opening title */
#studio-intro{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;color:#fff;opacity:1;transition:opacity .55s ease;pointer-events:all;font-family:Georgia,"Times New Roman",serif}
#studio-intro.is-ending{opacity:0;pointer-events:none}
#studio-intro .intro-inner{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:24px;text-align:center}\n#studio-intro .studio-credit{position:absolute;left:50%;top:50%;width:calc(100% - 40px);transform:translate(-50%,-50%);margin:0}\n#studio-intro .studio-credit.visible{transform:translate(-50%,-50%)}
#studio-intro .studio-credit{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:clamp(12px,2.5vw,19px);font-weight:500;letter-spacing:.18em;line-height:1.5;opacity:0;transform:translateY(8px);transition:opacity .45s ease,transform .45s ease}
#studio-intro .studio-credit.visible{opacity:1;transform:translateY(0)}
#studio-intro .intro-title{position:absolute;left:50%;top:50%;width:calc(100% - 24px);transform:translate(-50%,-50%);display:flex;justify-content:center;align-items:center;flex-wrap:wrap;column-gap:.27em;row-gap:.1em;margin:0;font-size:clamp(30px,7.2vw,76px);font-weight:700;letter-spacing:.045em;line-height:1.05}
#studio-intro .intro-word{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(4px);transition:opacity .42s ease,transform .42s ease,filter .42s ease}
#studio-intro .intro-word.visible{opacity:1;transform:translateY(0);filter:blur(0)}
@media(prefers-reduced-motion:reduce){#studio-intro,#studio-intro .studio-credit,#studio-intro .intro-word{transition:none}}

</style>

            <circle cx="630" cy="202" r="3"/><circle cx="383" cy="245" r="3"/><circle cx="537" cy="280" r="4"/>

<script>
(function () {
  const button = document.getElementById('startAction');
  const paper = document.getElementById('paperRoll');
  const hand = document.getElementById('paperHand');
  const head = document.getElementById('koksHead');
  const flour = document.getElementById('flourLine');
  const eraseMask = document.getElementById('eraseMask');
  const card = document.getElementById('biedronkaCard');
  const bottle = document.getElementById('sceneBottle');
  const bottleHand = document.getElementById('bottleHand');
  const bottleHand2 = document.getElementById('bottleHand2');
  const sceneProps = document.getElementById('sceneProps');
  const bottleSmoke = document.getElementById('bottleSmoke');
  const exhaleSmoke = document.getElementById('exhaleSmoke');
  const medicineProps = document.getElementById('medicineProps');
  const whitePills = document.getElementById('whitePills');
  const pillTaking = document.getElementById('pillTaking');
  const pill1 = document.getElementById('pill1');
  const pill2 = document.getElementById('pill2');
  const pill3 = document.getElementById('pill3');
  const pillReach = document.getElementById('pillReach');
  const mouthOpen = document.getElementById('mouthOpen');
  const mouthTongue = document.getElementById('mouthTongue');
  const tag = document.querySelector('.tag');
  const scene = document.querySelector('.scene');
  const finalScene = document.getElementById('finalScene');
  const finalGhost = document.getElementById('finalGhost');
  const deathGags = document.getElementById('deathGags');
  const deathCaption = document.getElementById('deathCaption');
  const heavenLight = document.getElementById('heavenLight');
  const memorialNotice = document.getElementById('memorialNotice');
  if (!button || !paper || !hand || !flour || !head || !eraseMask || !card || !bottle || !bottleHand || !bottleHand2 || !sceneProps || !bottleSmoke || !exhaleSmoke || !medicineProps || !whitePills || !pillTaking || !pill1 || !pill2 || !pill3 || !pillReach || !mouthOpen || !mouthTongue || !hubertFX || !sprayArm || !sprayMist || !boardArm || !fistArm || !impactStars || !reactionLines || !hubertCaption || !aftermathMarks || !transitionFade || !finalScene || !finalGhost || !heavenLight || !memorialNotice || !deathGags || !deathCaption) return;
  const headParent = head.parentNode;
  const headNextSibling = head.nextSibling;
  let busy = false;
  let stage = 0;
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

  function animate(duration, update) {
    return new Promise(resolve => {
      const start = performance.now();
      function tick(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = t * t * (3 - 2 * t);
        update(eased);
        if (t < 1) requestAnimationFrame(tick);
        else resolve();
      }
      requestAnimationFrame(tick);
    });
  }
  function setHead(x, y, angle) {
    head.setAttribute('transform', 'translate(' + x + ' ' + y + ') rotate(' + angle + ' 490 300)');
  }
  function setProps(x, y) {
    paper.setAttribute('transform', 'translate(' + x + ' ' + y + ') rotate(90)');
    hand.setAttribute('transform', 'translate(' + x + ' ' + y + ')');
  }

  async function playSecondScene() {
    busy = true;
    button.disabled = true;
    button.style.display = 'none';
    if (tag) tag.textContent = '11:31';

    // Krótkie, filmowe przejście między scenami.
    await animate(300, t => {
      const opacity = 1 - t;
      card.style.opacity = String(opacity);
      flour.style.opacity = String(opacity);
      paper.style.opacity = String(opacity);
      hand.style.opacity = String(opacity);
    });
    card.style.display = 'none';
    flour.style.display = 'none';
    paper.style.display = 'none';
    hand.style.display = 'none';
    sceneProps.style.opacity = '1';
    bottle.style.opacity = '1';
    bottleHand.style.opacity = '1';
    bottleHand2.style.opacity = '1';
    bottle.setAttribute('transform', 'translate(650 470) rotate(0)');
    bottleHand.setAttribute('transform', 'translate(650 470)');
    bottleHand2.setAttribute('transform', 'translate(650 470)');
    bottleSmoke.style.opacity = '1';
    bottleSmoke.setAttribute('transform', 'rotate(0)');

    // Szybkie, energiczne potrząsanie butelką; dym i woda wizualnie się mieszają.
    await animate(1050, t => {
      // Mocne, czytelne potrząsanie wyłącznie góra–dół: bez ruchu na boki i bez przechylania.
      const shakeY = Math.sin(t * Math.PI * 12) * 34;
      const x = 575;
      const y = 420 + shakeY;
      bottle.setAttribute('transform', 'translate(' + x + ' ' + y + ')');
      bottleHand.setAttribute('transform', 'translate(' + (x-4) + ' ' + (y+2) + ')');
      bottleHand2.setAttribute('transform', 'translate(' + (x+4) + ' ' + (y+2) + ')');
      bottleSmoke.setAttribute('transform', 'translate(0 ' + (Math.sin(t * Math.PI * 12) * 9) + ')');
      setHead(0, -2 * t, 0);
    });

    // Postać unosi butelkę; oba dłonie pozostają widoczne, a plastik lekko się ugina.
    await animate(550, t => {
      const x = 550 - 3*t, y = 405 - 5*t, angle = -28;
      bottle.setAttribute('transform', 'translate(' + x + ' ' + y + ') rotate(' + angle + ') scale(' + (1 - .035*Math.sin(t*Math.PI)) + ' 1)');
      bottleHand.setAttribute('transform', 'translate(' + (x-4) + ' ' + (y+2) + ') rotate(' + angle + ')');
      bottleHand2.setAttribute('transform', 'translate(' + (x+4) + ' ' + (y+2) + ') rotate(' + angle + ')');
      setHead(0, -5*t, 0);
    });

    // Najpierw kończy gest z butelką, po czym odkłada ją na środek blatu.
    await animate(500, t => {
      const x = 550 + 28*t, y = 400 + 70*t, angle = -28*(1-t);
      bottle.setAttribute('transform', 'translate(' + x + ' ' + y + ') rotate(' + angle + ') scale(' + (1 - .025*Math.sin(t*Math.PI)) + ' 1)');
      bottleHand.setAttribute('transform', 'translate(' + (x-4) + ' ' + (y+2) + ') rotate(' + angle + ')');
      bottleHand2.setAttribute('transform', 'translate(' + (x+4) + ' ' + (y+2) + ') rotate(' + angle + ')');
      setHead(0, -5 + 5*t, 0);
    });
    await animate(220, t => {
      bottleHand.style.opacity = String(1-t);
      bottleHand2.style.opacity = String(1-t);
    });
    bottleHand.style.opacity = '0';
    bottleHand2.style.opacity = '0';

    // Dopiero po odłożeniu butelki pojawia się duży obłok wydychanego dymu.
    await animate(1050, t => {
      exhaleSmoke.setAttribute('opacity', String(t));
      // Ogromna chmura rozlewa się od ust na dużą część kadru.
      const smokeScale = 1 + 8.5*t;
      exhaleSmoke.setAttribute('transform', 'translate(' + (540 - 540*smokeScale + 12*t) + ' ' + (300 - 300*smokeScale - 18*t) + ') scale(' + smokeScale + ')');
      bottleSmoke.setAttribute('opacity', String(1 - .7*t));
    });
    await sleep(120);
    busy = false;
    button.disabled = false;
    button.textContent = 'LECZ SIĘ';
    button.style.display = '';
    stage = 2;
  }

  async function playPillsScene() {
    busy = true;
    button.disabled = true;
    button.style.display = 'none';
    if (tag) tag.textContent = '14:53';
    await animate(460, t => {
      const opacity = 1 - t;
      bottle.style.opacity = String(opacity);
      sceneProps.style.opacity = String(opacity);
      exhaleSmoke.style.opacity = String(opacity);
      bottleSmoke.style.opacity = String(opacity);
    });
    bottle.style.display = 'none';
    sceneProps.style.display = 'none';
    exhaleSmoke.style.display = 'none';
    medicineProps.style.opacity = '1';
    whitePills.style.opacity = '1';
    pillTaking.style.opacity = '0';
    pillReach.style.opacity = '1';
    pillReach.setAttribute('transform', 'translate(0 245)');
    mouthOpen.style.opacity = '0';
    mouthTongue.style.opacity = '0';
    [pill1, pill2, pill3].forEach(p => p.setAttribute('opacity', '0'));

    // Hold on the spread-out, readable packages before the character acts.
    await sleep(700);

    // The hand visibly lowers to the loose pills, gathers several, then rises to the face.
    await animate(620, t => {
      const eased = t*t*(3-2*t);
      pillReach.setAttribute('transform', 'translate(0 ' + (245 - 15*eased) + ') rotate(' + (-5*eased) + ' 520 560)');
      setHead(0, 2*eased, 0);
    });
    await sleep(90);

    // Pills are now in the hand; the open mouth is visible before the hand reaches it.
    whitePills.style.opacity = '0';
    pillTaking.style.opacity = '1';
    [pill1, pill2, pill3].forEach((p, i) => {
      p.setAttribute('opacity', '1');
      p.setAttribute('cx', String(510 + i*9));
      p.setAttribute('cy', String(575 - i*5));
    });
    await animate(520, t => {
      const eased = t*t*(3-2*t);
      pillReach.setAttribute('transform', 'translate(0 ' + (230 - 230*eased) + ')');
      pillTaking.setAttribute('transform', 'translate(' + (0 - 5*eased) + ' ' + (-8*eased) + ')');
      setHead(0, -2*eased, 0);
    });
    mouthOpen.style.opacity = '1';
    mouthTongue.style.opacity = '1';

    // The handful reaches the open mouth; the pills disappear as they enter, like swallowing.
    await animate(650, t => {
      const eased = t*t*(3-2*t);
      pill1.setAttribute('cx', String(510 + 8*eased));
      pill1.setAttribute('cy', String(575 - 185*eased));
      pill2.setAttribute('cx', String(519 + 4*eased));
      pill2.setAttribute('cy', String(570 - 190*eased));
      pill3.setAttribute('cx', String(528 - 2*eased));
      pill3.setAttribute('cy', String(565 - 185*eased));
      // Fade each tablet right as it reaches the mouth, rather than leaving it floating.
      [pill1, pill2, pill3].forEach((p, i) => {
        const arrival = Math.max(0, Math.min(1, (eased - (0.55 + i*0.08)) / 0.22));
        p.setAttribute('opacity', String(1-arrival));
      });
      pillReach.setAttribute('transform', 'translate(0 ' + (-10*eased) + ')');
      setHead(0, -2 - 3*eased, 0);
    });
    [pill1, pill2, pill3].forEach(p => p.setAttribute('opacity', '0'));
    pillTaking.removeAttribute('transform');
    await sleep(100);
    // Brief swallowing motion, then the mouth closes and the hand drops away.
    await animate(300, t => {
      setHead(0, -5 + 5*t, 0);
      mouthOpen.style.opacity = String(1-t);
      mouthTongue.style.opacity = String(1-t);
      pillReach.setAttribute('transform', 'translate(0 ' + (-10 + 18*t) + ')');
    });
    pillReach.style.opacity = '0';
    pillTaking.style.opacity = '0';
    whitePills.style.opacity = '0';
    await sleep(250);
    busy = false;
    button.textContent = 'ZABAWA Z HUBERTEM';
    button.style.display = '';
    button.disabled = false;
    stage = 3;
  }

  async function playHubertScene() {
    busy = true;
    button.disabled = true;
    button.style.display = 'none';
    if (tag) tag.textContent = '18:12';
    await animate(450, t => {
      medicineProps.style.opacity = String(1-t);
      pillReach.style.opacity = String(1-t);
    });
    medicineProps.style.display = 'none';
    pillReach.style.display = 'none';
    pillTaking.style.display = 'none';
    whitePills.style.display = 'none';
    hubertFX.style.opacity = '1';
    hubertCaption.style.opacity = '1';
    await sleep(650);

    // Arms enter from both sides; Hubert notices the commotion.
    await animate(450, t => {
      sprayArm.setAttribute('transform', 'translate(' + (-240 + 240*t) + ' 0)');
      fistArm.setAttribute('transform', 'translate(' + (250 - 250*t) + ' 0)');
      setHead(-5*t, -2*t, -2*t);
    });
    // Keep a clearly visible spray cloud hanging in front of his face.
    sprayMist.style.opacity = '1';
    await animate(520, t => {
      sprayMist.setAttribute('transform', 'translate(' + (2*Math.sin(t*5)) + ' ' + (2*Math.sin(t*7)) + ') scale(' + (1 + .08*t) + ')');
      setHead(-9 - 5*t, -4*t, -4*t);
      mouthOpen.style.opacity = String(.2 + .8*t);
      reactionLines.style.opacity = String(t);
    });
    // Five-second slapstick barrage: spray stays visible while repeated board swats
    // and punches make his head recoil more strongly. No blood or graphic injury.
    await animate(5000, t => {
      const ms = t * 5000;
      const beat = Math.floor(ms / 560);
      const phase = (ms % 560) / 560;
      const hit = Math.max(0, 1 - phase * 3.2);
      const recoil = Math.sin(phase * Math.PI) * (8 + beat * 2.2);
      if (beat % 3 === 0) {
        boardArm.setAttribute('transform', 'translate(0 ' + (-320 + 355 * Math.min(1, phase * 2.4)) + ') rotate(' + (16 * Math.min(1, phase * 2.4)) + ' 660 170)');
        fistArm.setAttribute('transform', 'translate(0 0)');
      } else if (beat % 3 === 1) {
        boardArm.setAttribute('transform', 'translate(0 -320)');
        fistArm.setAttribute('transform', 'translate(' + (-250 + 120 * Math.min(1, phase * 2.8)) + ' 0)');
      } else {
        boardArm.setAttribute('transform', 'translate(0 ' + (-320 + 330 * Math.min(1, phase * 2.5)) + ') rotate(' + (10 * Math.min(1, phase * 2.5) + 5) + ' 660 170)');
        fistArm.setAttribute('transform', 'translate(' + (-250 + 85 * Math.min(1, phase * 2.5)) + ' 0)');
      }
      const direction = beat % 2 === 0 ? -1 : 1;
      setHead(direction * (5 + recoil + hit * (9 + beat * 1.4)), -2 + hit * (4 + beat), direction * (2 + hit * (5 + beat)));
      impactStars.style.opacity = hit > .55 ? '1' : '0';
      impactStars.setAttribute('transform', 'translate(' + (direction * 10 * hit) + ' ' + (-6 * hit) + ') scale(' + (1 + .22 * hit) + ')');
      reactionLines.style.opacity = hit > .2 ? '1' : '.35';
      // The mist billows and lingers instead of disappearing after the first puff.
      sprayMist.style.opacity = String(.7 + .3 * Math.abs(Math.sin(ms / 230)));
      sprayMist.setAttribute('transform', 'translate(' + (3 * Math.sin(ms / 180)) + ' ' + (4 * Math.sin(ms / 145)) + ') scale(' + (1.02 + .12 * Math.abs(Math.sin(ms / 210))) + ')');
      mouthOpen.style.opacity = String(.55 + .45 * Math.abs(Math.sin(ms / 190)));
    });
    impactStars.style.opacity = '0';
    sprayMist.style.opacity = '0';
    await animate(220, t => {
      setHead(-8 * (1-t), 3 * (1-t), -3 * (1-t));
      mouthOpen.style.opacity = String(1-t);
      reactionLines.style.opacity = String(1-t);
    });
    // Fade to black briefly, then reveal Hubert's cartoonish aftermath.
    await animate(450, t => {
      sprayArm.setAttribute('transform', 'translate(' + (240*t) + ' 0)');
      boardArm.setAttribute('transform', 'translate(0 ' + (-320 - 80*t) + ')');
      fistArm.setAttribute('transform', 'translate(' + (-250*t) + ' 0)');
      setHead(0, 0, 0);
      reactionLines.style.opacity = '0';
      transitionFade.setAttribute('opacity', String(.72*t));
    });
    aftermathMarks.style.opacity = '1';
    await sleep(180);
    await animate(650, t => {
      transitionFade.setAttribute('opacity', String(.72*(1-t)));
      setHead(-2*(1-t), 1*(1-t), -1*(1-t));
    });
    hubertCaption.textContent = 'KONIEC ZABAWY';
    hubertCaption.style.opacity = '1';
    button.textContent = 'POWIEDZ, ŻE ZAJEBAŁEŚ W SZAFĘ I IDŹ SPAĆ';
    button.style.display = '';
    button.disabled = false;
    busy = false;
    stage = 4;
  }


  async function playFinalScene() {
    busy = true;
    button.disabled = true;
    button.style.display = 'none';
    if (tag) tag.textContent = '21:36';
    await animate(650, t => transitionFade.setAttribute('opacity', String(t)));
    finalScene.setAttribute('opacity', '1');
    finalGhost.setAttribute('opacity', '0');
    heavenLight.setAttribute('opacity', '0');
    memorialNotice.setAttribute('opacity', '0');
    deathGags.setAttribute('opacity', '0');
    deathCaption.setAttribute('opacity', '0');
    await sleep(250);
    await animate(850, t => transitionFade.setAttribute('opacity', String(1-t)));
    // Najpierw absurdalny komunikat i wizualny gag, potem dusza wystrzeliwuje do nieba.
    deathGags.setAttribute('opacity', '1');
    await animate(1150, t => {
      deathCaption.setAttribute('opacity', String(Math.min(1, t*2)));
      const shake = Math.sin(t*38) * (1-t) * 5;
      document.getElementById('sleepingBody').setAttribute('transform', 'translate(' + shake + ' ' + (Math.sin(t*24)*2) + ') rotate(' + (-2 + Math.sin(t*20)*1.5) + ' 490 550)');
      transitionFade.setAttribute('opacity', String(.08 + Math.abs(Math.sin(t*16))*.09));
    });
    await animate(500, t => {
      deathCaption.setAttribute('opacity', String(1-t));
      transitionFade.setAttribute('opacity', String(.15 + t*.45));
    });
    transitionFade.setAttribute('opacity', '0');
    // Dusza odrywa się od łóżka i leci w stronę dużej chmury.
    await animate(3900, t => {
      const eased = t*t*(3-2*t);
      finalGhost.setAttribute('opacity', String(.95 - .2*eased));
      finalGhost.setAttribute('transform', 'translate(' + (Math.sin(t*8)*5) + ' ' + (-390*eased) + ') scale(' + (1 - .12*eased) + ')');
      heavenLight.setAttribute('opacity', String(Math.min(1, t*1.8)));
      deathGags.setAttribute('opacity', String(1-t));
      transitionFade.setAttribute('opacity', '0');
    });
    // Chwilowe zanikanie, potem kościelna klepsydra z nekrologiem.
    await animate(700, t => transitionFade.setAttribute('opacity', String(t)));
    finalScene.setAttribute('opacity', '0');
    memorialNotice.setAttribute('opacity', '1');
    await animate(900, t => transitionFade.setAttribute('opacity', String(1-t)));
    button.textContent = 'KONIEC';
    button.style.display = '';
    button.disabled = true;
    busy = false;
    stage = 5;
  }

  button.addEventListener('click', async function () {
    if (busy) return;
    if (stage === 1) {
      await playSecondScene();
      return;
    }
    if (stage === 2) {
      await playPillsScene();
      return;
    }
    if (stage === 3) {
      await playHubertScene();
      return;
    }
    if (stage === 4) {
      await playFinalScene();
      return;
    }
    if (stage >= 5) return;
    busy = true;
    button.disabled = true;
    button.style.display = 'none';

    // Put the moving head in front of the tabletop; keep powder and props above it.
    flour.parentNode.insertBefore(head, flour);
    flour.style.opacity = '1';
    paper.style.opacity = '1';
    hand.style.opacity = '1';
    eraseMask.setAttribute('width', '0');
    eraseMask.setAttribute('x', '550');
    setHead(0, 0, 0);
    setProps(640, 500);

    // Reach for the roll, visibly grip it, then bring it toward the face.
    await animate(550, t => {
      setProps(640 + (605 - 640) * t, 500 + (510 - 500) * t);
    });
    await sleep(100);
    await animate(650, t => {
      setProps(605 + (490 - 605) * t, 510 + (332 - 510) * t);
      setHead(0, 8 * t, 0);
    });

    // The character slowly slumps down to the tabletop, keeping the roll at the nose.
    await animate(1050, t => {
      const dy = 145 * t;
      const dx = 70 * t;
      setHead(dx, dy, 5 * t);
      setProps(490 + dx, 332 + dy);
    });

    // Sweep across the full powder line; the mask follows the roll in real time.
    await animate(1050, t => {
      const dx = 70 + 102 * t;
      const rollX = 490 + dx;
      setHead(dx, 145, 5);
      setProps(rollX, 477);
      eraseMask.setAttribute('width', String(Math.max(0, rollX - 550)));
    });
    await sleep(250);

    // Pull back and sit upright; the powder stays erased after the pass.
    await animate(800, t => {
      setHead(172 * (1 - t), 145 * (1 - t), 5 * (1 - t));
      setProps(662 + (640 - 662) * t, 477 + (500 - 477) * t);
    });

    if (headNextSibling && headNextSibling.parentNode === headParent) headParent.insertBefore(head, headNextSibling);
    else headParent.appendChild(head);
    button.disabled = false;
    button.textContent = 'ZAJEB TŁOKA';
    button.style.display = '';
    stage = 1;
    busy = false;
  });
})();
</script>


<script>
(function(){
  const intro = document.getElementById('studio-intro');
  if (!intro) return;
  const credit = intro.querySelector('.studio-credit');
  const words = Array.from(intro.querySelectorAll('.intro-word'));
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  async function runStudioIntro(){
    await wait(180);
    credit.classList.add('visible');
    await wait(1450);
    credit.style.opacity = '0';
    credit.style.transform = 'translate(-50%,-50%) scale(.98)';
    await wait(170);
    for (const word of words) {
      word.classList.add('visible');
      await wait(680);
    }
    await wait(650);
    intro.classList.add('is-ending');
    await wait(600);
    intro.remove();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', runStudioIntro, {once:true});
  } else {
    runStudioIntro();
  }
})();
</script>


<script>
(function(){
  // Disable pinch/double-tap zoom on touch devices while preserving normal scrolling.
  document.addEventListener('gesturestart', e => e.preventDefault(), {passive:false});
  document.addEventListener('gesturechange', e => e.preventDefault(), {passive:false});
  document.addEventListener('gestureend', e => e.preventDefault(), {passive:false});
  document.addEventListener('touchmove', e => {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, {passive:false});
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, {passive:false});
})();
</script>
