<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#15152b"><title>Mączny Chaos</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15152b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:manipulation}#app{height:100dvh;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 0%,#37315b,#15152b 68%)}header{width:min(100%,520px);display:flex;align-items:center;justify-content:space-between;gap:7px}h1{font-size:clamp(20px,5.5vw,34px);margin:0;font-weight:900;letter-spacing:-1px}h1 span{color:#f6c85f}.pill{background:#292747;border:1px solid #4b4772;border-radius:14px;padding:7px 9px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}p{margin:8px 0 12px;color:#c9c7e5;text-align:center;font-size:14px}.board{position:relative;width:min(100%,520px);flex:1;min-height:180px;max-height:660px;border:2px solid #514b7e;border-radius:24px;overflow:hidden;background:linear-gradient(#242444,#303055 65%,#6c5263);box-shadow:0 18px 60px #09091688}canvas{width:100%;height:100%;display:block;touch-action:none}.bottom{width:min(100%,520px);display:flex;gap:8px;margin-top:12px}.btn{border:0;border-radius:16px;padding:13px 9px;font-size:15px;font-weight:900;cursor:pointer;flex:1;color:#211b39;background:#f6c85f;box-shadow:0 4px 0 #bd8d30;touch-action:manipulation}.btn.secondary{background:#302e50;color:white;box-shadow:0 4px 0 #1d1b36;border:1px solid #514b7e}.hint{font-size:12px;color:#aaa7ce;text-align:center;margin-top:9px}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#15152bdc;text-align:center}.panel{max-width:320px}.panel h2{font-size:30px;margin:0 0 8px}.panel p{line-height:1.45}.hidden{display:none}
@media(max-height:620px){#app{padding-top:8px;padding-bottom:6px}p{margin:5px 0 7px}.bottom{margin-top:8px}.btn{padding:10px 7px}.hint{margin-top:5px}.board{min-height:150px}}
</style></head><body><main id="app"><header><h1>MĄCZNY <span>CHAOS</span></h1><div class="pill">⭐ <span id="score">0</span></div><div class="pill">⏱ <span id="time">30</span></div></header><p>Złap mączne chmurki odkurzaczem, zanim narobią bałaganu!</p><section class="board"><canvas id="game"></canvas><div id="overlay" class="overlay"><div class="panel"><h2>Gotowy na chaos?</h2><p>Przesuwaj odkurzacz palcem i łap spadające obłoczki mąki. Uważaj na czarne grudki!</p><button id="start" class="btn">GRAMY!</button></div></div></section><div class="bottom"><button id="left" class="btn secondary">◀</button><button id="suck" class="btn">ZBIERAJ MĄKĘ ✨</button><button id="right" class="btn secondary">▶</button></div><div class="hint">Wersja mobilna • działa w przeglądarce</div></main>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),overlay=document.getElementById('overlay');let w=0,h=0,score=0,time=30,running=false,last=0,spawn=0,items=[],playerX=.5,move=0,raf=0;
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;c.width=Math.max(1,Math.round(w*d));c.height=Math.max(1,Math.round(h*d));ctx.setTransform(d,0,0,d,0,0)}new ResizeObserver(resize).observe(c);resize();
function reset(){score=0;time=30;items=[];playerX=.5;move=0;spawn=0;scoreEl.textContent=score;timeEl.textContent=time}
function start(){reset();running=true;overlay.classList.add('hidden');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function end(){running=false;overlay.classList.remove('hidden');overlay.innerHTML=`<div class="panel"><h2>${score>=15?'MISTRZ PORZĄDKU!':'KONIEC CZASU!'}</h2><p>Zebrane chmurki: <b>${score}</b><br>${score>=15?'Stół lśni czystością. Szacun!':'Spróbuj jeszcze raz i pobij swój wynik!'}</p><button id="again" class="btn">JESZCZE RAZ</button></div>`;document.getElementById('again').onclick=start}
function addItem(){items.push({x:Math.random()*(w-34)+17,y:-20,r:8+Math.random()*9,vy:65+Math.random()*80,bad:Math.random()<.19,phase:Math.random()*6})}
function drawPlayer(){const x=playerX*w,y=h-50;ctx.save();ctx.translate(x,y);ctx.fillStyle='#f6c85f';ctx.strokeStyle='#211b39';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-24,-10,43,27,9);ctx.fill();ctx.stroke();ctx.fillStyle='#e8e7f4';ctx.beginPath();ctx.arc(-5,-17,15,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#34304e';ctx.beginPath();ctx.arc(0,-20,2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#b8d9f7';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(13,0);ctx.quadraticCurveTo(31,-13,24,-32);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(21,-32);ctx.lineTo(29,-32);ctx.stroke();ctx.fillStyle='#2d2949';ctx.beginPath();ctx.arc(-14,19,6,0,Math.PI*2);ctx.arc(14,19,6,0,Math.PI*2);ctx.fill();ctx.restore()}
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.04);last=now;time-=dt;if(time<=0){time=0;timeEl.textContent=0;end();return}timeEl.textContent=Math.ceil(time);spawn-=dt;if(spawn<=0){addItem();spawn=Math.max(.22,.62-score*.008)}playerX=Math.max(.09,Math.min(.91,playerX+move*dt*.75));ctx.clearRect(0,0,w,h);ctx.fillStyle='#8b6b76';ctx.fillRect(0,h-25,w,25);ctx.strokeStyle='#b99aa2';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,h-25);ctx.lineTo(w,h-25);ctx.stroke();
for(let i=items.length-1;i>=0;i--){let a=items[i];a.y+=a.vy*dt;a.x+=Math.sin(now/430+a.phase)*18*dt;ctx.save();ctx.translate(a.x,a.y);ctx.fillStyle=a.bad?'#343044':'#fff8e8';ctx.strokeStyle=a.bad?'#171626':'#e0d7c7';ctx.lineWidth=2;ctx.beginPath();ctx.arc(-a.r*.5,0,a.r*.65,0,Math.PI*2);ctx.arc(a.r*.35,-a.r*.25,a.r*.8,0,Math.PI*2);ctx.arc(a.r*.65,a.r*.25,a.r*.55,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();if(a.y>h-85&&Math.abs(a.x-playerX*w)<39){if(a.bad){score=Math.max(0,score-2)}else score++;scoreEl.textContent=score;items.splice(i,1)}else if(a.y>h+30)items.splice(i,1)}drawPlayer();raf=requestAnimationFrame(loop)}
document.getElementById('start').onclick=start;document.getElementById('left').onpointerdown=()=>move=-1;document.getElementById('right').onpointerdown=()=>move=1;for(const id of ['left','right']){document.getElementById(id).onpointerup=()=>move=0;document.getElementById(id).onpointercancel=()=>move=0;document.getElementById(id).onpointerleave=()=>move=0}document.getElementById('suck').onpointerdown=()=>{if(running){items=items.filter(a=>{if(Math.abs(a.x-playerX*w)<100&&a.y>h-180){if(!a.bad){score++;scoreEl.textContent=score}return false}return true})}};c.addEventListener('pointermove',e=>{if(!running)return;const r=c.getBoundingClientRect();playerX=(e.clientX-r.left)/r.width});
})();
</script></body></html>
