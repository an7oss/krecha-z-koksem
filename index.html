<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101014">
<title>KRECHA Z KOKSEM</title>
<style>
:root{color-scheme:dark;--bg:#101014;--cream:#eee7d9;--muted:#a5a0a0;--red:#c73a37}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100svh;overflow-x:hidden}
.page{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:clamp(18px,4vw,42px) 16px 20px;background:radial-gradient(ellipse at 50% 10%,#2c2020 0%,#171519 38%,#101014 75%)}
.top{width:min(100%,980px);display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand{font-weight:950;letter-spacing:.075em;font-size:clamp(19px,4vw,30px);line-height:1.05}
.brand span{display:block;color:var(--red);margin-top:5px}
.tag{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#b6aeb0;border:1px solid #554448;padding:9px 11px;border-radius:99px;white-space:nowrap}
.scene{position:relative;width:min(100%,980px);aspect-ratio:1.18/1;min-height:390px;max-height:72svh;border:1px solid #4b3d3d;border-radius:18px;overflow:hidden;background:#1b1719;box-shadow:0 28px 90px #0009}
.scene:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0b09092b 0%,transparent 30%,#0808091f 64%,#080809a8 100%),radial-gradient(ellipse at center,transparent 42%,#0505078a 100%)}
svg{display:block;width:100%;height:100%}
.actionbar{width:min(100%,980px);display:flex;justify-content:center;margin-top:16px}\n.action-button{appearance:none;border:0;border-radius:10px;padding:15px 24px;background:#c73a37;color:#fff4eb;font:900 15px/1 Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;cursor:pointer;box-shadow:0 7px 0 #772321,0 12px 26px #0005;transition:transform .12s,filter .12s}\n.action-button:hover{filter:brightness(1.12)}.action-button:active{transform:translateY(4px);box-shadow:0 3px 0 #772321,0 7px 16px #0005}.action-button:disabled{opacity:.65;cursor:wait}\n.actionbar{width:min(100%,980px);display:flex;justify-content:center;margin-top:16px}.action-button{border:0;border-radius:10px;padding:15px 24px;background:#c73a37;color:#fff4eb;font:900 15px/1 Inter,system-ui,sans-serif;letter-spacing:.08em;cursor:pointer;box-shadow:0 7px 0 #772321,0 12px 26px #0005}.action-button:disabled{opacity:.7;cursor:wait}\n.caption{width:min(100%,980px);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-top:17px}
.caption h1{font-size:clamp(18px,3vw,26px);letter-spacing:.02em;margin:0;font-weight:850}
.caption p{margin:7px 0 0;color:var(--muted);font-size:14px;line-height:1.55;max-width:540px}
.status{flex:none;border-left:2px solid var(--red);padding:3px 0 3px 12px;color:#d8b6b4;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.grain{position:absolute;inset:0;opacity:.13;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");mix-blend-mode:screen}
@media(max-width:560px){.page{padding:18px 12px 22px}.top{margin-bottom:14px}.tag{font-size:8px;padding:8px}.scene{aspect-ratio:.73/1;min-height:0;max-height:none}.caption{flex-direction:column;gap:12px}.status{margin-top:1px}.caption p{font-size:13px}}
@media(min-width:561px) and (max-height:650px){.scene{min-height:300px;max-height:62svh}}
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <div class="brand">KRECHA <span>Z KOKSEM</span></div>
    <div class="tag">Prototyp • scena 01</div>
  </header>
  <section class="scene" aria-label="Koks siedzi przy stole; na blacie leży karta Moja Biedronka i rulonik">
    <svg viewBox="0 0 980 760" role="img" aria-labelledby="sceneTitle" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <title id="sceneTitle">Koks siedzi przy stole w ciemnym pokoju</title>
      <defs>
        <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#393033"/><stop offset=".56" stop-color="#211c20"/><stop offset="1" stop-color="#151316"/></linearGradient>
        <radialGradient id="lamp"><stop stop-color="#b66e50" stop-opacity=".42"/><stop offset="1" stop-color="#b66e50" stop-opacity="0"/></radialGradient>
        <linearGradient id="hood" x2=".9" y2="1"><stop stop-color="#39353b"/><stop offset=".5" stop-color="#211f25"/><stop offset="1" stop-color="#121216"/></linearGradient>
        <linearGradient id="skin" x2=".8" y2="1"><stop stop-color="#b97e63"/><stop offset="1" stop-color="#68453e"/></linearGradient>

        <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f5f0e4"/><stop offset="1" stop-color="#c9bfae"/></linearGradient>
        <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
        <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="15"/></filter>
      </defs>
      <rect width="980" height="760" fill="url(#wall)"/>
      <ellipse cx="500" cy="155" rx="350" ry="270" fill="url(#lamp)"/>
      <g opacity=".38" fill="#0d0c10"><rect x="55" y="0" width="10" height="370"/><rect x="917" y="0" width="8" height="360"/><rect x="0" y="300" width="980" height="3"/></g>
      <g opacity=".16" stroke="#a57c6a" stroke-width="2"><path d="M0 128H980M0 131H980M0 372H980"/></g>
      <!-- shadow behind the seated figure -->
      <ellipse cx="493" cy="552" rx="285" ry="150" fill="#08080b" opacity=".7" filter="url(#blur)"/>
      <!-- torso and hoodie -->
      <path d="M296 760 L310 506 Q323 430 386 397 Q438 372 491 375 Q550 372 600 399 Q660 430 674 509 L693 760Z" fill="url(#hood)" stroke="#494148" stroke-width="3"/>
      <path d="M385 411 Q410 365 490 362 Q570 366 598 414 L561 493 Q525 520 491 521 Q450 516 421 491Z" fill="#17171c" stroke="#51474b" stroke-width="4"/>
      <path d="M420 408 Q452 433 490 434 Q530 431 562 408" fill="none" stroke="#5a4d50" stroke-width="4" opacity=".6"/>
      <g id="koksHead">
      <!-- neck -->
      <path d="M448 344 L447 401 Q490 434 531 400 L526 344Z" fill="url(#skin)"/>
      <!-- head -->
      <path d="M410 214 Q414 163 491 159 Q567 163 573 224 L563 304 Q550 353 492 369 Q436 353 419 304Z" fill="url(#skin)"/>
      <!-- hair -->
      <path d="M407 243 Q386 188 424 151 Q453 126 499 135 Q551 132 576 171 Q592 201 572 251 L559 222 Q548 195 523 187 Q479 210 428 193 L420 249Z" fill="#171518"/>
      <path d="M421 180 Q465 149 524 163" fill="none" stroke="#574044" stroke-width="8" stroke-linecap="round" opacity=".7"/>
      <!-- ears -->
      <ellipse cx="414" cy="267" rx="13" ry="24" fill="#98634f"/><ellipse cx="568" cy="267" rx="13" ry="24" fill="#98634f"/>
      <!-- face, eyebrows, eyes -->
      <path d="M434 250 Q454 237 472 248M509 248 Q530 236 550 250" stroke="#302226" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M438 264 Q453 257 468 264M514 264 Q531 257 545 264" stroke="#171519" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M490 264 L479 298 Q489 307 502 298" stroke="#805244" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M463 326 Q491 338 520 324" stroke="#4a2929" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M454 336 Q491 353 527 335" stroke="#d09579" stroke-width="3" fill="none" opacity=".55"/>
      </g>
      <!-- arms resting near the table -->
      <path d="M340 457 Q371 432 405 456 L445 547 Q450 574 429 587 Q408 596 391 572 L342 516Z" fill="#28252b" stroke="#51474a" stroke-width="3"/>
      <path d="M633 457 Q600 433 574 456 L541 547 Q536 574 556 587 Q577 596 594 572 L637 516Z" fill="#28252b" stroke="#51474a" stroke-width="3"/>
      <path d="M408 559 Q430 545 449 563 L470 590 Q477 604 463 614 Q450 620 438 608 L410 589Z" fill="url(#skin)"/>
      <path d="M568 559 Q548 545 530 563 L510 590 Q502 604 516 614 Q529 620 541 608 L568 589Z" fill="url(#skin)"/>
      <!-- table legs / table -->
      <path d="M126 530 L854 530 L913 760 L70 760Z" fill="#171214"/>
      <path d="M42 492 Q490 465 938 492 L980 550 Q492 579 0 550Z" fill="#76503e"/>
      <path d="M0 538 Q489 566 980 538 L980 760 L0 760Z" fill="url(#wood)"/>
      <path d="M0 561 Q480 586 980 561 M0 625 Q490 649 980 625 M0 699 Q490 719 980 699" fill="none" stroke="#8a6048" stroke-width="3" opacity=".35"/>
      <path d="M80 583 Q260 601 410 591 M625 595 Q785 607 925 584" fill="none" stroke="#1f1717" stroke-width="4" opacity=".5"/>
      <!-- irregular, scattered powder close to the back edge of the tabletop -->
      <mask id="flourEraseMask" maskUnits="userSpaceOnUse" x="540" y="490" width="160" height="45">
        <rect x="540" y="490" width="160" height="45" fill="white"/>
        <rect id="eraseMask" x="550" y="490" width="0" height="45" fill="black"/>
      </mask>
      <g id="flourLine" mask="url(#flourEraseMask)">
        <ellipse cx="611" cy="509" rx="58" ry="9" fill="#e9dfce" opacity=".14" filter="url(#shadow)"/>
        <path d="M560 509 Q570 505 580 508 T601 507 T620 509 T641 506 T662 508" fill="none" stroke="#f4eee2" stroke-width="7" stroke-linecap="round" opacity=".96"/>
        <path d="M562 506 Q573 503 582 506 T602 505 T621 507 T641 504 T660 506" fill="none" stroke="#fffaf0" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>
        <g fill="#f7f1e7" opacity=".92">
          <circle cx="561" cy="504" r="2"/><circle cx="568" cy="512" r="1.7"/><circle cx="575" cy="506" r="2.1"/>
          <circle cx="585" cy="511" r="1.8"/><circle cx="592" cy="503" r="1.5"/><circle cx="600" cy="509" r="2"/>
          <circle cx="609" cy="504" r="1.8"/><circle cx="617" cy="512" r="2.1"/><circle cx="625" cy="503" r="1.6"/>
          <circle cx="633" cy="508" r="2.2"/><circle cx="643" cy="502" r="1.7"/><circle cx="651" cy="510" r="1.9"/>
          <circle cx="661" cy="505" r="1.5"/>
        </g>
      </g>
      <!-- Karta lojalnościowa Moja Biedronka, zwyczajnie leżąca na blacie -->
      <g id="biedronkaCard" transform="translate(425 560) rotate(-9)">
        <ellipse cx="2" cy="5" rx="77" ry="43" fill="#100c0b" opacity=".42" filter="url(#shadow)"/>
        <rect x="-73" y="-38" width="146" height="76" rx="7" fill="#e9e5dd" stroke="#bdb6ab" stroke-width="1.5"/>
        <rect x="-69" y="-34" width="138" height="68" rx="5" fill="#f8f5ed"/>
        <path d="M-69 -29 Q-69 -34 -63 -34 H63 Q69 -34 69 -28 V-8 H-69Z" fill="#d91e2b"/>
        <text x="-59" y="-17" font-size="12" font-weight="900" letter-spacing=".2" fill="#fff">moja</text>
        <text x="-59" y="5" font-size="16" font-weight="950" letter-spacing="-.5" fill="#d91e2b">BIEDRONKA</text>
        <circle cx="48" cy="-21" r="10" fill="#fff" opacity=".95"/>
        <circle cx="44" cy="-23" r="2" fill="#d91e2b"/><circle cx="51" cy="-25" r="2" fill="#d91e2b"/><circle cx="51" cy="-17" r="2" fill="#d91e2b"/><circle cx="44" cy="-16" r="2" fill="#d91e2b"/>
        <g fill="#252326" transform="translate(-55 14)">
          <rect x="0" y="0" width="2" height="15"/><rect x="4" y="0" width="1" height="15"/><rect x="8" y="0" width="3" height="15"/><rect x="14" y="0" width="1" height="15"/><rect x="18" y="0" width="2" height="15"/><rect x="23" y="0" width="4" height="15"/><rect x="30" y="0" width="1" height="15"/><rect x="34" y="0" width="2" height="15"/><rect x="39" y="0" width="1" height="15"/><rect x="43" y="0" width="3" height="15"/><rect x="49" y="0" width="1" height="15"/><rect x="53" y="0" width="2" height="15"/><rect x="58" y="0" width="4" height="15"/><rect x="65" y="0" width="1" height="15"/><rect x="69" y="0" width="3" height="15"/><rect x="75" y="0" width="1" height="15"/><rect x="79" y="0" width="2" height="15"/><rect x="84" y="0" width="1" height="15"/><rect x="88" y="0" width="4" height="15"/><rect x="95" y="0" width="1" height="15"/>
        </g>
        <text x="49" y="27" font-size="5.5" text-anchor="middle" fill="#77716a">KARTA</text>
      </g>
      <!-- paper roll and the hand that picks it up -->
      <g id="paperRoll" transform="translate(640 500) rotate(90)">
        <ellipse cx="3" cy="14" rx="36" ry="10" fill="#100d0e" opacity=".32"/>
        <rect x="-32" y="-1" width="65" height="15" rx="7.5" fill="url(#paper)" stroke="#a69b8e" stroke-width="2"/>
        <ellipse cx="-30" cy="6.5" rx="6" ry="7.5" fill="#ded4c4" stroke="#9f9487" stroke-width="1.5"/>
        <ellipse cx="30" cy="6.5" rx="5" ry="6.5" fill="#a89d90"/>
        <path d="M-14 0 L-13 12 M7 0 L8 12" stroke="#b9ad9d" stroke-width="1.5" opacity=".8"/>
      </g>
      <g id="paperHand" transform="translate(640 500)">
        <path d="M-78 77 Q-53 53 -28 28 L-7 9 Q2 1 10 8 Q15 13 8 20 L-3 32 Q12 25 19 33 Q23 40 14 46 L4 53 Q14 52 17 60 Q18 67 8 72 L-5 80 Q-16 90 -31 94 L-62 103Z" fill="url(#skin)" stroke="#744c40" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M-1 17 Q7 20 12 28 M2 39 Q10 43 14 46 M-7 58 Q1 63 8 64" fill="none" stroke="#d59a7d" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <!-- subtle warm pool of light over the tabletop -->
      <ellipse cx="490" cy="530" rx="340" ry="74" fill="#d39a6a" opacity=".08"/>
    </svg>
    <div class="grain"></div>
  </section>
  <div class="actionbar"><button class="action-button" id="startAction" type="button">ZAJEB PASA</button></div>
</main>

<script>
(function () {
  const button = document.getElementById('startAction');
  const paper = document.getElementById('paperRoll');
  const hand = document.getElementById('paperHand');
  const head = document.getElementById('koksHead');
  const flour = document.getElementById('flourLine');
  const eraseMask = document.getElementById('eraseMask');
  if (!button || !paper || !hand || !flour || !head || !eraseMask) return;
  const headParent = head.parentNode;
  const headNextSibling = head.nextSibling;
  let busy = false;
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

  function animate(duration, update) {
    return new Promise(resolve => {
      const start = performance.now();
      function tick(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = t * t * (3 - 2 * t);
        update(eased);
        if (t < 1) requestAnimationFrame(tick);
        else resolve();
      }
      requestAnimationFrame(tick);
    });
  }
  function setHead(x, y, angle) {
    head.setAttribute('transform', 'translate(' + x + ' ' + y + ') rotate(' + angle + ' 490 300)');
  }
  function setProps(x, y) {
    paper.setAttribute('transform', 'translate(' + x + ' ' + y + ') rotate(90)');
    hand.setAttribute('transform', 'translate(' + x + ' ' + y + ')');
  }

  button.addEventListener('click', async function () {
    if (busy) return;
    busy = true;
    button.disabled = true;
    button.style.display = 'none';

    // Put the moving head in front of the tabletop; keep powder and props above it.
    flour.parentNode.insertBefore(head, flour);
    flour.style.opacity = '1';
    paper.style.opacity = '1';
    hand.style.opacity = '1';
    eraseMask.setAttribute('width', '0');
    eraseMask.setAttribute('x', '550');
    setHead(0, 0, 0);
    setProps(640, 500);

    // Reach for the roll, visibly grip it, then bring it toward the face.
    await animate(550, t => {
      setProps(640 + (605 - 640) * t, 500 + (510 - 500) * t);
    });
    await sleep(100);
    await animate(650, t => {
      setProps(605 + (490 - 605) * t, 510 + (332 - 510) * t);
      setHead(0, 8 * t, 0);
    });

    // The character slowly slumps down to the tabletop, keeping the roll at the nose.
    await animate(1050, t => {
      const dy = 145 * t;
      const dx = 70 * t;
      setHead(dx, dy, 5 * t);
      setProps(490 + dx, 332 + dy);
    });

    // Sweep across the full powder line; the mask follows the roll in real time.
    await animate(1050, t => {
      const dx = 70 + 102 * t;
      const rollX = 490 + dx;
      setHead(dx, 145, 5);
      setProps(rollX, 477);
      eraseMask.setAttribute('width', String(Math.max(0, rollX - 550)));
    });
    await sleep(250);

    // Pull back and sit upright; the powder stays erased after the pass.
    await animate(800, t => {
      setHead(172 * (1 - t), 145 * (1 - t), 5 * (1 - t));
      setProps(662 + (640 - 662) * t, 477 + (500 - 477) * t);
    });

    if (headNextSibling && headNextSibling.parentNode === headParent) headParent.insertBefore(head, headNextSibling);
    else headParent.appendChild(head);
    button.disabled = false;
    button.textContent = 'ZAJEB TŁOKA';
    button.style.display = '';
    busy = false;
  });
})();
</script>

</body>
</html>
